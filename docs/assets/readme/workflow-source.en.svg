<svg xmlns="http://www.w3.org/2000/svg" width="2664" height="1490" viewBox="0 0 1332 745" role="img" aria-label="Seven-stage research workflow"><title>Seven-stage research workflow</title><defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#299b73"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b1842f"/></marker></defs><g font-family="Arial, Hiragino Sans GB, Noto Sans CJK SC, sans-serif"><path d="M 230,491 C 266,491 302,491 338,491" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><path d="M 402,443 C 389,365 419,309 461,254" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><path d="M 582,160 C 625,145 686,145 730,160" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><path d="M 850,254 C 893,314 923,382 909,443" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><path d="M 880,539 C 840,604 788,645 743,657" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><path d="M 656,620 C 656,570 656,524 656,475" fill="none" stroke="#b1842f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="6 7" marker-end="url(#gold)"/><path d="M 543,410 C 525,432 508,466 490,491" fill="none" stroke="#b1842f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="6 7" marker-end="url(#gold)"/><path d="M 590,321 C 565,301 532,278 506,254" fill="none" stroke="#b1842f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="6 7" marker-end="url(#gold)"/><path d="M 722,321 C 747,301 780,278 806,254" fill="none" stroke="#b1842f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="6 7" marker-end="url(#gold)"/><path d="M 769,410 C 785,432 801,466 816,491" fill="none" stroke="#b1842f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="6 7" marker-end="url(#gold)"/><path d="M 743 668 H 952 M 1018 668 H 1197 V 565" fill="none" stroke="#299b73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"  marker-end="url(#green)"/><text x="985" y="672" fill="#299b73" font-size="11" font-weight="600" text-anchor="middle">PASS</text><text x="667" y="574" fill="#b1842f" font-size="11" font-weight="600" text-anchor="start">REVISE</text><circle cx="1197" cy="565" r="4" fill="#299b73"/><text x="20" y="426" fill="#77877e" font-size="13" font-weight="600" text-anchor="start">PREPARE</text><text x="1082" y="382" fill="#77877e" font-size="13" font-weight="600" text-anchor="start">RESEARCH OUTPUT</text><g data-stage="1"><rect x="20" y="443" width="210" height="96" rx="8" fill="none" stroke="#8da69b" stroke-width="1"/><text x="34" y="466" fill="#299b73" font-size="12.5" font-weight="600" text-anchor="start">01</text><text x="34" y="490" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Literature</text><text x="34" y="510" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Grounding</text></g><g data-stage="2"><rect x="338" y="443" width="152" height="96" rx="8" fill="none" stroke="#8da69b" stroke-width="1"/><text x="352" y="466" fill="#299b73" font-size="12.5" font-weight="600" text-anchor="start">02</text><text x="352" y="490" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Research</text><text x="352" y="510" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Framing</text></g><g data-stage="3"><rect x="430" y="158" width="152" height="96" rx="8" fill="none" stroke="#8da69b" stroke-width="1"/><text x="444" y="181" fill="#299b73" font-size="12.5" font-weight="600" text-anchor="start">03</text><text x="444" y="205" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Method Design</text></g><g data-stage="4"><rect x="730" y="158" width="152" height="96" rx="8" fill="none" stroke="#8da69b" stroke-width="1"/><text x="744" y="181" fill="#299b73" font-size="12.5" font-weight="600" text-anchor="start">04</text><text x="744" y="205" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Experiment</text><text x="744" y="225" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Design</text></g><g data-stage="5"><rect x="816" y="443" width="164" height="96" rx="8" fill="none" stroke="#8da69b" stroke-width="1"/><text x="830" y="466" fill="#299b73" font-size="12.5" font-weight="600" text-anchor="start">05</text><text x="830" y="490" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Implementation</text><text x="830" y="510" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">&amp; Execution</text></g><g data-stage="6"><rect x="569" y="620" width="174" height="96" rx="8" fill="none" stroke="#b1842f" stroke-width="1"/><text x="583" y="643" fill="#b1842f" font-size="12.5" font-weight="600" text-anchor="start">06</text><text x="583" y="667" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Analysis &amp; Review</text></g><g data-stage="7"><rect x="1082" y="399" width="230" height="166" rx="8" fill="none" stroke="#5787b3" stroke-width="2.5"/><text x="1096" y="429" fill="#5787b3" font-size="12.5" font-weight="600" text-anchor="start">07</text><text x="1096" y="454" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">Artifact Packaging</text><text x="1096" y="474" fill="#62766a" font-size="15" font-weight="600" text-anchor="start">&amp; Paper Writing</text><text x="1096" y="504" fill="#708177" font-size="12.5" font-weight="400" text-anchor="start">Organize the paper, code, figures,</text><text x="1096" y="524" fill="#708177" font-size="12.5" font-weight="400" text-anchor="start">and reproducible research outputs.</text></g><g data-role="review"><rect x="543" y="321" width="226" height="154" rx="8" fill="none" stroke="#b1842f" stroke-opacity="0.5" stroke-width="1"/><text x="656" y="347" fill="#62766a" font-size="18" font-weight="600" text-anchor="middle">Research review</text><text x="656" y="368" fill="#708177" font-size="12" font-weight="400" text-anchor="middle">Review prior stages; return to</text><text x="656" y="384" fill="#708177" font-size="12" font-weight="400" text-anchor="middle">the relevant stage when revision</text><text x="656" y="400" fill="#708177" font-size="12" font-weight="400" text-anchor="middle">is needed.</text><g data-revisit-target="2"><rect x="562" y="419" width="44" height="44" rx="5" fill="none" stroke="#b1842f" stroke-opacity="0.4" stroke-width="1"/><text x="584" y="446" fill="#708177" font-size="13" font-weight="600" text-anchor="middle">02</text></g><g data-revisit-target="3"><rect x="610" y="419" width="44" height="44" rx="5" fill="none" stroke="#b1842f" stroke-opacity="1" stroke-width="1.8"/><text x="632" y="446" fill="#b1842f" font-size="13" font-weight="600" text-anchor="middle">03</text></g><g data-revisit-target="4"><rect x="658" y="419" width="44" height="44" rx="5" fill="none" stroke="#b1842f" stroke-opacity="0.4" stroke-width="1"/><text x="680" y="446" fill="#708177" font-size="13" font-weight="600" text-anchor="middle">04</text></g><g data-revisit-target="5"><rect x="706" y="419" width="44" height="44" rx="5" fill="none" stroke="#b1842f" stroke-opacity="0.4" stroke-width="1"/><text x="728" y="446" fill="#708177" font-size="13" font-weight="600" text-anchor="middle">05</text></g></g></g></svg>
